name: PR Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'deployment/**'
      - 'uv.lock'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}


      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --locked --extra lint --extra eval

      - name: Guard lockfile against private package mirrors
        # Cloud builds use `uv sync --frozen`; a lock pointing at a private
        # mirror fails remotely with an opaque "Build failed".
        run: |
          if grep -q "airlock-proxy" uv.lock; then
            echo "uv.lock references a private mirror; re-lock against public PyPI." && exit 1
          fi

      - name: Lint (ruff, codespell, ty)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run codespell
          uv run ty check .

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run integration tests
        # Integration tests run the agent in-process; pytest doesn't load .env.
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          BQ_ANALYTICS_ENABLED: 'false'
        run: uv run pytest tests/integration

      - name: Run agent evaluation
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          BQ_ANALYTICS_ENABLED: 'false'
        run: uvx google-agents-cli@1.8.0 eval run --dataset tests/eval/datasets/core.json

      - name: Eval quality gate
        # `eval run` exits 0 regardless of scores; enforce the bar explicitly.
        run: uv run python tests/eval/check_thresholds.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: artifacts/grade_results/
          if-no-files-found: ignore
